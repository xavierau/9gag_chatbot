[project]
name = "note-manager"
version = "0.1.0"
description = "MCP server for note management - CRUD operations with AI summarization and semantic search"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastmcp>=2.0.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pgvector>=0.3.0",
    "dspy>=2.6.0",
    "chatbot",
]

[tool.uv.sources]
chatbot = { path = "../../", editable = true }

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "aiosqlite>=0.19.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.build.targets.sdist]
include = ["src/note_manager"]

[tool.hatch.build.targets.wheel]
packages = ["src/note_manager"]
sources = ["src"]
